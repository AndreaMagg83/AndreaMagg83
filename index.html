<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Agenda personale con note vocali e un assistente che ti ricorda gli impegni.">
  <title>Agenda Vocale</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Agenda Vocale</h1>
      <p id="today" class="muted"></p>
    </div>
    <button id="notify-btn" class="icon-btn" title="Attiva notifiche" aria-label="Attiva notifiche">🔔</button>
  </header>

  <main>
    <!-- ===== NOTE ===== -->
    <section id="view-notes" class="view active" aria-label="Note">
      <div class="card composer">
        <button id="rec-btn" class="mic" aria-label="Registra una nota vocale">
          <span class="mic-icon">🎙️</span>
        </button>
        <p id="rec-hint" class="muted center">Tocca il microfono e detta la tua nota.<br>
          Es: <em>"Ricordami di chiamare il dentista domani alle 10"</em></p>

        <div id="draft" class="draft hidden">
          <textarea id="draft-text" rows="3" placeholder="Testo della nota…"></textarea>
          <label class="field">
            <span>Quando</span>
            <input id="draft-date" type="datetime-local">
          </label>
          <p id="draft-audio" class="muted small hidden">🎧 Audio registrato allegato</p>
          <div class="row">
            <button id="draft-cancel" class="btn ghost">Annulla</button>
            <button id="draft-save" class="btn primary">Salva nota</button>
          </div>
        </div>

        <div class="row small">
          <label class="check"><input id="keep-audio" type="checkbox" checked> Salva anche l'audio</label>
          <button id="type-btn" class="link">✏️ Scrivi a mano</button>
        </div>
      </div>

      <nav class="filters" aria-label="Filtra note">
        <button class="chip active" data-filter="upcoming">Prossime</button>
        <button class="chip" data-filter="today">Oggi</button>
        <button class="chip" data-filter="undated">Senza data</button>
        <button class="chip" data-filter="done">Completate</button>
        <button class="chip" data-filter="all">Tutte</button>
      </nav>

      <div id="note-list"></div>
    </section>

    <!-- ===== ASSISTENTE ===== -->
    <section id="view-agent" class="view" aria-label="Assistente">
      <div id="chat" class="chat" aria-live="polite"></div>
      <div class="suggestions">
        <button class="chip" data-ask="Cosa devo fare oggi?">Oggi</button>
        <button class="chip" data-ask="Cosa ho domani?">Domani</button>
        <button class="chip" data-ask="Cosa ho questa settimana?">Settimana</button>
        <button class="chip" data-ask="Prossimi impegni">Prossimi impegni</button>
        <button class="chip" data-ask="Cosa ho scaduto?">Scaduti</button>
      </div>
      <form id="ask-form" class="ask-bar">
        <button type="button" id="ask-mic" class="icon-btn" aria-label="Chiedi a voce">🎙️</button>
        <input id="ask-input" type="text" placeholder="Chiedi all'assistente…" autocomplete="off">
        <button type="submit" class="icon-btn" aria-label="Invia">➤</button>
      </form>
      <label class="check small center"><input id="speak-replies" type="checkbox" checked> Leggi le risposte ad alta voce</label>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="view-notes"><span>📝</span>Note</button>
    <button class="tab" data-view="view-agent"><span>🤖</span>Assistente</button>
  </nav>

  <div id="toast" class="toast hidden" role="alert"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
